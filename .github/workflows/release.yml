name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if missing, e.g. 1.0.1)'
        required: true

env:
  PLUGIN_NAME: obsidian-infio-copilot-free

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # On tag push: check out the tag. On manual dispatch: build from the
      # default branch and let the release step create the tag if needed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build
        id: build
        run: |
          pnpm install
          pnpm add js-yaml
          pnpm build
          pnpm copy-pglite-assets

      - name: Test
        id: test
        run: |
          pnpm test

      - name: Resolve tag
        id: get_tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Bundle
        id: bundle
        run: |
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          cp pglite-assets/postgres.wasm pglite-assets/postgres.data pglite-assets/vector.tar.gz ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}-${{ steps.get_tag.outputs.tag_name }}.zip ${{ env.PLUGIN_NAME }}
          ls

      - name: Get release notes
        id: release_notes
        run: |
          chmod +x .github/scripts/get-changelog.js
          CHANGELOG=$(node .github/scripts/get-changelog.js ${{ steps.get_tag.outputs.tag_name }})
          if [ -z "$CHANGELOG" ]; then
            echo "Error: No release notes found for version ${{ steps.get_tag.outputs.tag_name }} in CHANGELOG.yaml"
            exit 1
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true   # attestations API is unavailable for forks; never block the release
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            ${{ env.PLUGIN_NAME }}-${{ steps.get_tag.outputs.tag_name }}.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          files: |
            ${{ env.PLUGIN_NAME }}-${{ steps.get_tag.outputs.tag_name }}.zip
            main.js
            manifest.json
            styles.css
            pglite-assets/postgres.wasm
            pglite-assets/postgres.data
            pglite-assets/vector.tar.gz
          body: ${{ steps.release_notes.outputs.changelog }}
