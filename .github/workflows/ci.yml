name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# onnxruntime-node 1.21.0 postinstall auto-detects CUDA on Linux x64 and tries
# to fetch the GPU binaries; that tarball 404s upstream, failing the install.
# CI has no GPU, so only the CPU EP is installed (same env the package docs
# recommend: ONNXRUNTIME_NODE_INSTALL_CUDA=skip).
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run type:check
      - name: Lint ratchet (no new ESLint violations)
        run: pnpm run lint:ratchet
      - name: CSS lint ratchet (no new stylelint violations)
        run: pnpm run lint:css:ratchet
      - name: Test
        run: pnpm test
