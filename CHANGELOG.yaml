      - "Local (built-in) embedding models load reliably again on desktop: the embedding worker no longer lets Electron's process shim trick the ONNX Runtime loader into a Node-only code path ('Failed to resolve module specifier worker_threads' / 'no available backend found'), and the WASM backend is now selected explicitly - embedding vectors are unchanged, existing indexes stay valid"
      - "Hugging Face mirror failover (hf-mirror.com) now actually applies when huggingface.co is unreachable - the previous fallback code set the mirror before the library was imported and silently did nothing"
    other:
      - "Dependency diet part 1: the langchain tree (~35 packages: langchain, @langchain/core, langsmith, js-tiktoken, ...) is gone - replaced by a local port of RecursiveCharacterTextSplitter verified byte-identical against langchain 0.3.37 with a 98-case differential matrix and golden tests; note chunking is unchanged, so no reindexing is needed"
      - "Dependency diet part 2: embedding engine migrated from the deprecated @xenova/transformers v2 to @huggingface/transformers v3 (onnxruntime-web 1.14 -> 1.22); the unused smart-embed-model dependency is removed"
      - "WebGPU acceleration for embeddings intentionally deferred to the on-device/mobile phase (roadmap 1) - the ORT webgpu backend needs bundling investigation first; the worker stays on WASM q8, the same backend v2 effectively used"
  - version: "1.1.1"
    fixes:
      - "Catalog submission compliance: the settings heading in the mobile placeholder tab no longer includes the plugin name (checker rule 'Avoid including the plugin name in settings headings')"
  - version: "1.1.0"
    features:
      - "Ollama is now a first-class local provider: the model picker lists models pulled from your Ollama server (/api/tags) instead of requiring manual entry"
      - "New defaults for fresh installs: Ollama for chat/insight/apply models and the on-device LocalProvider for embeddings - no API key or cloud service required"
    fixes:
      - "Removed the discontinued Infio cloud provider entirely: no more calls to api.infio.app (model list, subscription/plan checks), no device-id reporting code, no dead Pro/API-key modals; the cloud-backed built-in MCP server is gone (user-configured MCP servers are unaffected)"
      - "Reading non-Markdown files and web pages no longer depends on the dead cloud conversion service: mentions fall back to file metadata, YouTube transcripts and HTML-to-Markdown"
      - "manifest.json now honestly declares isDesktopOnly until real mobile support lands (the mobile build previously only showed a settings tab for the discontinued service)"
      - "About-panel and zh-CN README links pointed at dead or upstream-only pages; they now point to this repository and its issue tracker"
    other:
      - "Settings schema 0.6 with automatic migration: stored Infio selections are remapped to Ollama (chat/insight/apply) and to LocalProvider with the local TaylorAI/bge-micro-v2 embedding model, stale Infio model ids are cleared, collected-model lists are filtered instead of discarded, and Infio credentials are deleted from plugin data"
      - "Dependency diet: unused @huggingface/transformers removed (53 fewer installed packages); dead checkGeneral/device-id code removed"
      - "Contributor docs match CI again (pnpm 12); public roadmap added as ROADMAP.md"
  - version: "1.0.7"
    fixes:
