releases:
  - version: "1.7.7"
    fixes:
      - "CRITICAL dual-support fix (regression risk from 1.7.6): declarative.ts evaluated `class SectionPage extends SettingPage` at module scope, but SettingPage does not exist on Obsidian < 1.13 - the plugin would have thrown 'Class extends value undefined' during load on older hosts. The subclass is now declared inside the createSectionPage() factory, evaluated only when a 1.13+ host actually opens a section page; pre-1.13 hosts import the module without ever touching the missing base class, and display() renders as before"
      - "The About banner is visible again the moment plugin settings are opened (wave-1 field report): it became a full-width render definition at the top of the tab, mounting the same PluginInfoSettings React component through renderPluginInfoSection; a new .icf-defs-fullwidth CSS pair hides the empty name column and lets the control span the row; the row is excluded from the settings search (searchable: false - it is not a setting)"
      - "Double spoilers gone for RAG and AutoComplete (wave-1 field report): both sections build their own icf-collapsible-* fold, which inside a declarative page folded the content twice. The four imperative renderers (File search, Web search, RAG, AutoComplete) now accept embedded=true from the page factories: heading rows and fold chrome are skipped and the content renders expanded - the page navigation row is the heading. The legacy display() path (<1.13) calls them without the flag, so pre-1.13 users keep the original collapsibles untouched"
      - "Model parameters moved under a page row for a uniform tab look (field request): the five native number controls became inline items of a 'Model parameters' SettingDefinitionPage - one navigation row like every other section, with the same native controls (still declaratively editable and bound through the dotted keys). Chat behavior stays an inline group (a single dropdown row)"
    other:
      - "modelOptions audit (prompted by the user question 'do Model parameters apply to all models or only the chat model?'): they apply to CHAT-model requests only - ChatView and InlineEdit are the sole runtime consumers (autocomplete has its own parameters; embeddings and insights ignore modelOptions). Moreover only temperature and max_tokens actually reach the LLM: top_p, frequency_penalty and presence_penalty are commented out in BOTH request builders, so those three settings currently store values without effect. No behavior change in this release - whether to uncomment them (restores the knobs but changes generation output) or to mark the controls as inert is a separate maintainer decision, recorded in ROADMAP"
      - "Obsidian plugin-validator 'obsidianmd/no-unsupported-api' findings are NOT a transitional migration artifact: of the ~170 flagged sites only 6 (src/settings/declarative.ts) come from the declarative work - the rest are pre-existing API usage across ~30 files (ChatView, main.desktop, trans-engine, McpHub, SettingTab's Setting rows, mentionable, prompt-generator, ...) that predates 1.7.x. The rule compares each API's @since against the manifest's minAppVersion (0.15.0, inherited from upstream and long fictional); the only complete fix is raising minAppVersion - with the declarative Settings API intentionally in the tree, the consistent value is 1.13.0. Tracked as a separate decision (it gates catalog submission, not releases)"
      - "Tests 329 -> 330: the About render-row definition is pinned (position, non-searchability), page factories now assert the embedded flag (RAG/AutoComplete/File search/Web search mounted with embedded=true, Models without), the Model-parameters page shape (items instead of a factory) and its five dotted keys/bounds are pinned as before. Gates: targeted ESLint ratchet - 0 violations in the new/changed declarative files and SettingTab.tsx exactly at its frozen 17; type-check 0; jest 330/330 console-clean; stylelint ratchet unchanged at 2 (the new CSS pair adds no violations); production build green (main.js ~15.5 MB)"
  - version: "1.7.6"
    features:
      - "Declarative Settings API support (phase 3 item 1, wave 1): the settings tab now implements getSettingDefinitions() for Obsidian 1.13+, in the official dual-support mode (migration guide Path B) - hosts older than 1.13 never call it and render display() exactly as before, so minAppVersion stays 0.15.0 and no runtime version detection exists. On 1.13+ the tab renders from the definition tree: eight entries in the exact order of the legacy display() sections; Model parameters is migrated to five native number controls bound to dotted keys (modelOptions.temperature / top_p / frequency_penalty / presence_penalty / max_tokens, min/max/step mirroring modelOptionsSchema exactly) and Chat behavior to a native dropdown (defaultMention with the identical option set) - both are indexed by Obsidian's global settings search and editable natively; the other six sections (About, Models, File search, Web search, RAG, AutoComplete) are page entries whose SectionPage factory mounts the existing React/imperative renderers unchanged, so the familiar UI survives inside the declarative shell"
      - "Writes made through declarative controls are guarded end to end: getControlValue/setControlValue resolve dotted paths (readSettingPath/writeSettingPath, immutable), and every candidate is re-validated with InfioSettingsSchema.safeParse before reaching plugin.setSettings - an out-of-range value (max_tokens < 4096, top_p > 1, ...) is rejected with a logger.warn instead of persisted"
    other:
      - "obsidian devDependency 1.8.7 -> 1.13.1 (official types carrying the 1.13 Settings API): type-check is 0 errors across the whole project and jest is green on the bump alone - a types-only upgrade with no runtime surface change. pnpm install is required after applying (the lockfile is regenerated)"
      - "New i18n keys settings.PluginInfo.title and settings.Models.title added to en/ru/zh-cn in sync (About/О плагине/关于, Models/Модели/模型) - the locale-completeness test stays green; all other names/descriptions reuse existing keys. MAINTAINING.md gains a 'Declarative settings migration' section: the dual-support contract, the dotted-key + safeParse guard, the rule that control bounds must mirror the zod schemas, and the step-by-step for migrating the next section (wave 2+)"
      - "Tests 321 -> 329 in 26 suites (src/settings/declarative.test.ts, 8 cases): the eight-section order pinned through t() keys, the five dotted number controls with bounds asserted against the exported schema constants, the dropdown option set against the legacy labels, every page factory verified to produce a SectionPage that mounts the matching legacy renderer into its containerEl, readSettingPath/writeSettingPath immutability and missing-segment behavior, and the safeParse guard (two rejection cases plus the pinned .catch('none') degradation of defaultMention). The __mocks__/obsidian.ts stub gains SettingPage"
      - "Gates: targeted ESLint ratchet over every touched file - 0 violations in the new files and SettingTab.tsx exactly at its frozen 17; type-check 0; jest 329/329 with a clean console; stylelint ratchet untouched (no CSS changes); production build green (main.js ~15.5 MB, size unchanged). Visual check on 1.13+: Settings -> Infio Copilot Free shows the eight entries, each page opens the familiar UI, global settings search finds 'Temperature' and 'Default mention for new chat', values edited natively persist across reloads; below 1.13 the tab is pixel-identical to 1.7.5"
  - version: "1.7.5"
    other:
      - "MILESTONE - phase-3 item 3 (CSS without !important) is DONE: the final CodeMirror-adjacent cluster (15 flags) is resolved and tracked declaration-no-important reaches ZERO (311 at the 1.7.0 freeze -> 0). Like cluster 4, every transform is backed by measurement, not guesswork: the competitors were extracted from Obsidian's app.css 1.13.7 (official obsidian-1.13.7.asar.gz asset), the CM6 base-theme was read from the bundled @codemirror/view dist AND the official app.js (Obsidian injects it at runtime through StyleModule)"
      - "ApplyView cm-editor/cm-scroller (4 flags) - the flags turned out to be copies of CM6's OWN injected !important values: the base theme ships '.cm-editor { position: relative !important; display: flex !important }' and '.cm-scroller { display: flex !important; align-items: flex-start !important }'. Our declarations carried the identical values, so they were removed outright (the CM injections supply byte-identical computed styles; a plain declaration could never beat an !important one anyway) - documented with in-file comments. The unflagged neighbors (flex/min-height/padding/line-height/...) stay: they outrank the CM theme rules at (1,2,1) with unchanged values"
      - "JSON/data-file view gutters (2 flags): .datafile-source-view.mod-cm6 .cm-gutters at (0,3,0) keeps color and border-right plain - the measured competitors are the CM-injected '&light/&dark .cm-gutters' theme rules at (0,2,0) plain (color/background) and '.cm-gutters.cm-gutters-before' at (0,3,0) setting only border-right-WIDTH; our border-right-style:none wins the painting regardless of the width tie, and app.css's identical-looking important rule is scoped to .markdown-source-view and never matches this view"
      - "Inline-edit ai-block wrapper (3 flags): the class is added at runtime by the markdown post-processor to the section parent (inline-edit-processor.ts), which in Live Preview sits in .cm-embed-block territory - the selector is tripled to .icf-ai-block.icf-ai-block.icf-ai-block ((0,3,0), element-agnostic) which outranks every measured competitor (app.css .markdown-rendered pre (0,2,0) background/padding, the .cm-embed-block family which sets none of the three properties, CM theme modules at (0,2,0)). Inline-edit textarea (4 flags incl. the hover/focus block): scoped to .icf-ai-block-input-wrapper textarea.icf-ai-block-content ((0,2,1)) - ties the core textarea:not(:disabled):hover at (0,2,1) and post-dates it (plugin CSS loads after app.css), while the nested state rules at (0,3,1) outrank the core focus ring - flags removed, declarations untouched. Select option pair (2 flags): no author-level competitor exists (app.css styles option only under .dropdown/.annotationLayer/.search-results-info, none of which match) - flags removed"
      - "End state of styles.css: 0 tracked !important; the only remaining flags are the 20 KaTeX declarations inside the scoped stylelint-disable documented in the MAINTAINING.md exception registry (the gate still blocks any new flag). stylelint-baseline.json: 2 (the .icf-popover ul / li:hover duplicate-selector pair, queued for a janitorial release along with the inert :not(dead-class) guards and the dangling .trunk/* symlinks pointing at an upstream developer's macOS cache). styles.css is 88.4 KB -> 48.8 KB (-45%) versus the 1.6.24 freeze while gaining explanatory comments for every non-obvious cascade decision"
      - "Visual verification surfaces (transforms are computed to be exact, but these are live editor-adjacent rules - a sanity pass is warranted in light and dark, default and Minimal): (1) inline edit - trigger the AI edit block on a note section: wrapper has no code-block background/border/padding, the textarea is flat (no border at rest/hover/focus, no focus ring), model dropdown options render with normal text color; (2) Apply view - open a diff/apply tab: the editor fills the pane, scrolls vertically, content column is centered with file margins; (3) a data/JSON file opened in the plugin's datafile view: line-number gutter is transparent, faint text, no right border"
      - "Gates: stylelint ratchet green against the shrunk baseline (0 parse errors), jest 321/321 in 25 suites, type-check 0 errors (no TS changes), production build unaffected (styles.css ships as-is, src/ untouched)"
  - version: "1.7.4"
    other:
      - "Phase-3 !important burn-down, cluster 4 - the live input/button rules (29 flags -> 0), converted with an exact per-property cascade calculation against Obsidian's own stylesheet: app.css was extracted from the official release asset obsidian-1.13.7.asar.gz (published by obsidianmd/obsidian-releases) and the real competitor set measured - inputs face the global textarea/input[type=text] block at (0,1,1) (background, border, padding, font-size, border-radius, outline), a separate height rule at (0,1,1), hover at (0,3,1) (input[type=text]:not(:disabled):hover) and focus at (0,2,1) (border-color + box-shadow ring); buttons face button at (0,0,1) (display, padding, height, border 0, ...) plus button:not(.clickable-icon), button:hover and button:focus-visible at (0,1,1) (color, background-color, box-shadow). Converted rules: the chat edit cancel button (7 flags), the CommandsView name input (3), search input incl. its :focus block (5), edit-name input (2), the commands icon button incl. hover (8), and the model-search input (4). Every rule is re-anchored to a scoped selector - container chain + element binding, e.g. .icf-commands-container .icf-commands-search input.icf-commands-search-input at (0,3,1) or .icf-chat-edit-container button.icf-chat-edit-cancel-button at (0,2,1) - which strictly outsizes (or ties and post-dates, since plugin CSS always loads after app.css) every measured competitor including the (0,3,1) hover, so the flags are provably redundant"
      - "Preservation contract - the release changes zero pixels: declarations the core always outbid (and that therefore NEVER rendered: input padding/height/font-size/border-radius where the core value differed, the cancel button's rest-state color and background, the commands icon button's color) are removed instead of being scoped up, keeping today's computed appearance byte-stable; the hover/focus border-color shifts on the edit-name input that the core used to paint are replicated as explicit &:hover/&:focus rules; every state behavior is kept as-is (the name input keeps the core focus ring, the search input keeps suppressing it, the model-search input keeps losing its border on focus while keeping the ring). Also removed: three vendor-prefixed border-radius aliases (-webkit/-moz/-ms) and an inert justify-content on an input element"
      - "Tracked CSS debt: declaration-no-important 44 -> 15, stylelint-baseline.json shrunk 46 -> 17 in the same commit. The entire remainder is the CodeMirror-adjacent cluster planned for 1.7.5: inline-edit ai-block family 9 (incl. 2 on select options), apply-view cm-editor/cm-scroller 4, JSON-view cm-gutters 2. The 20 KaTeX flags remain a documented exception (MAINTAINING.md registry), not tracked debt. Cumulative phase-3 progress: 311 -> 15 tracked !important (-95%), styles.css 88.4 KB -> ~48 KB"
      - "Visual verification surfaces for this release (the transforms are computed to be exact, but these are live rules, so a sanity pass is warranted in default and Minimal themes, light and dark): the chat message edit mode cancel button (top-right of the editing bubble: rest background, hover background, 24x24 size), the Commands view (new-command name input pill, search pill with transparent input, edit mode: name input border visible at rest / border-color shift on hover / border-color + ring on focus, transparent 24px icon buttons with gray hover), and the model selector dropdown search input (74% width, square corners, border at rest, border gone + ring on focus)"
      - "Gates: stylelint ratchet green against the shrunk baseline (0 parse errors), jest 321/321 in 25 suites, type-check 0 errors (no TS changes), production build unaffected (styles.css ships as-is, src/ untouched)"
  - version: "1.7.3"
    other:
      - "Phase-3 !important burn-down, cluster 3 - the zero-risk subset (every removal is provably a no-op, everything else is reclassified, no live cascade changes): (1) the nested .icf-markdown .icf-markdown-inline-code rule (19 !important: font, padding, colors, position/transform resets) targeted a class no renderer ever emits - the code() renderers in src distinguish inline vs block solely by the language-* className, and the only inline-code literal in src is SearchView's own obsidian-inline-code (a styled-components class); the rule never matched a single node, so deleting it changes nothing. The :not(.icf-markdown-inline-code) guards elsewhere in the file stay (inert; simplified in a janitorial pass). (2) The KaTeX math overrides (20 !important across 5 rules) are reclassified as a documented exception instead of being removed: they must beat KaTeX's own stylesheet, which Obsidian bundles inside app.css, for the accessible HTML/MathML split - the clip/hide pattern is KaTeX's standard technique and dropping the flags would demand per-engine math-rendering tests for no user-visible gain; the region is wrapped in a scoped stylelint-disable declaration-no-important with an in-file justification comment and a new 'stylelint exceptions with written justification' registry in MAINTAINING.md (policy: exceptions only as scoped disables + a registry entry). (3) The .icf-ai-block-model-select::-webkit-listbox rule loses its 3 flags: the pseudo-element is inert in modern Chromium (the select popup is OS-rendered), and neither Obsidian core nor Minimal/Things style it - verified against the downloaded current theme files (which also confirmed: zero !important on any button/input rule in both themes). (4) The background-color flags of two plain-div wrappers (.icf-commands-textarea, .icf-commands-search) are removed - no core or theme rule targets bare divs"
      - "Tracked CSS debt: declaration-no-important 88 -> 44 (24 provably inert removals + 20 reclassified justified exceptions); stylelint-baseline.json shrunk 90 -> 46 in the same commit per the ratchet policy; styles.css 2285 -> 2274 lines. The remaining 44 all sit on live rules and split into the two clusters that need genuine per-property cascade analysis against Obsidian core instead of deletion: input/button rules (29 - commands-view input/search-input+focus/btn+hover/edit-name 18, chat edit cancel button 7, model-search input 4; core's input[type=text] at (0,1,1) and button/:hover are the competitors - planned 1.7.4) and CodeMirror-adjacent rules (15 - inline-edit ai-block family 9 incl. 2 on select options, apply-view cm-editor/cm-scroller 4, JSON-view cm-gutters 2; planned 1.7.5)"
      - "Docs: ROADMAP phase-3 status records the 311 -> 44 progress and the 1.7.4/1.7.5 cluster plan; MAINTAINING.md gains the stylelint exception registry. Gates: stylelint ratchet green against the shrunk baseline (0 parse errors, 0 invalid disable directives), jest 321/321 in 25 suites, type-check 0 errors (no TS changes), production build unaffected (styles.css ships as-is)"
  - version: "1.7.2"
    other:
      - "Phase-3 !important burn-down, cluster 2 - the dead-CSS sweep (zero visual change by construction). A full audit cross-referenced every icf-* class in styles.css against every git-tracked file: 122 of 287 classes have zero references in the shipped tree, and src contains no dynamic icf-* class construction at all (the only template-literal class building in the codebase is codicon-* in MermaidBlock), so the dead set is exact. A rule-precise remover deleted 176 top-level blocks (~1480 lines) only where EVERY comma-separated selector part references a dead class positively - references inside :not()/:where() do not count, and mixed live/dead rules are kept. Deleted families: icf-apply-button-primary/-secondary/-applying + icf-applying-status + icf-apply-status-icon (the live Apply button carries icf-apply-button, which never had rules of its own - the buttons keep rendering exactly as before, i.e. as plain Obsidian buttons), icf-icon-selector* (the live ImageSelectorModal uses icf-image-selector - kept byte-identical, verified by diff), the whole commands/market/starred-commands region, icf-markdown-table*/-link*/-actions/-container-with-actions/-create-button/-action-button, icf-chat-list-dropdown sub-items (the live base dropdown class is kept), the legacy icf-llm-* settings family, icf-dialog-*, icf-progress-*/-structured-progress/-chat-loading-container/-loading-spinner, icf-mermaid-container/-loading/-error* INCLUDING the .theme-dark .icf-mermaid-container dark-mode adjustments (MermaidBlock has been styled-components + codicon icons for a long time; those theme rules matched nothing), icf-raw-markdown-code-block, icf-reasoning-markdown-wrapper, icf-autocomplete-loader*, icf-tool-result-content, icf-search-web-button, icf-chat-current-workspace"
      - "The one live rule in the Apply-button region - the code-block header button height cap (确保复制按钮也有相同的高度限制) - lost its 6 !important flags. Its selector computes to (0,6,1) specificity (.icf-chat-code-block.has-filename .icf-chat-code-block-header-button button:not(x):not(y):not(z)) and still outsizes every identified competitor: Obsidian core button/:hover rules are at most (0,1,1), the in-file header-button rules are (0,2,1)..(0,4,1) and the hover one only sets background-color, and both Minimal and Things were downloaded and audited - neither theme carries a single !important on button rules (49 and 34 !important total in 265 KB / 70 KB of theme CSS, none button-related). Computed styles are unchanged; the :not() guards now reference deleted classes, which is inert (no element ever carries them) and gets simplified in a janitorial pass"
      - "Orphan cleanup: the duplicate @keyframes spin (identical frames, 0%/100% vs from/to) under the dead chat-loading comment is deleted; the live copy next to .spinner (used by Loader2 icons) remains and is now the single definition. Numbers: declaration-no-important 204 -> 88 (-110 dead, -6 live rule), no-duplicate-selectors 3 -> 2 (the icf-commands-market-name pair went out with its section), block-no-empty 1 -> 0 (the empty block sat in a dead zone); stylelint-baseline.json shrunk 208 -> 90 in the same commit per the ratchet policy; styles.css 3768 -> 2285 lines, 80.8 -> 48.4 KB (-40%); 0 parse errors"
      - "Remaining !important debt map (88, all on live rules - each cluster now needs a specificity replacement plus a real-vault visual check in Minimal/Things and light/dark): KaTeX overrides ~20 (legitimate candidates - they beat the KaTeX library's own stylesheet; may end up documented with scoped stylelint-disable comments instead of removal), diff/ApplyView CodeMirror scoping ~28, user-message overflow guards ~19, pc/mobile view controls 9, chat editing cancel button 7, webkit scrollbars 3, JSON-view cm-gutters 2"
      - "Gates: stylelint ratchet green against the shrunk baseline, jest 321/321 in 25 suites, type-check 0 errors (no TS changes), production build unaffected (styles.css ships as-is, src/ untouched). The sweep is diff-reviewed: every deleted selector is listed in the removal report; the kept-rule byte-identity was verified for the two rules adjacent to deletions (icf-image-selector, icf-image-selector-header)"
  - version: "1.7.1"
    other:
      - "Phase-3 !important burn-down, cluster 1 - dead CSS removal (zero visual change by construction): the 12 tool-block sections of styles.css (Read File / Tool Result / Plan / Reasoning Content / List Files / Manage Files / Match Search / Regex Search / Search Web / Semantic Search / Transformation Tool / Dataview Query - the 'Minimal styling for better integration' family) target modifier classes that do not exist in the DOM. All 12 root classes (icf-read-file-block, icf-tool-result-block, icf-plan-block, icf-reasoning-content-block, icf-list-files-block, icf-manage-files-block, icf-match-search-files-block, icf-regex-search-files-block, icf-search-web-block, icf-semantic-search-files-block, icf-transformation-tool-block, icf-dataview-query-block) and the whole icf-reasoning-markdown family have zero grep hits across the repository (src, asserts, mocks, tests, html/json); the components actually render icf-chat-code-block + has-filename (+ icf-reasoning-block on the plan/apply-diff/search-replace/tool-result roots) and icf-chat-code-block-response for tool results. Removed: 57 rule blocks / 370 lines, deletions only (zero added lines in the diff), burning 107 of the 311 declaration-no-important (311 -> 204) and one no-duplicate-selectors pair (4 -> 3); stylelint-baseline.json shrunk 316 -> 208 in the same commit, per the ratchet policy. Live neighbors verified untouched: the .icf-reasoning-content-wrapper rules (used by MarkdownPlanBlock/MarkdownApplyDiffBlock/MarkdownSearchAndReplace/MarkdownToolResult) and the adjacent Lexical section; the file parses clean (0 stylelint parse errors)"
      - "Remaining !important debt map after cluster 1 (204; the next 1.7.x clusters style live DOM, so unlike this one each ships with a real-vault visual check in Minimal/Things and light/dark): Apply button styles 49, Icon Selector 22, Mermaid dark-mode adjustments 20, chat init loading animation 17, user-message overflow guards 15, Market Commands 14, inline code in tables 12, pc/mobile view controls 9, copy-button height guards 8, chat editing cancel button 7, plus 31 across small clusters"
      - "Gates: stylelint ratchet green against the shrunk baseline (the check reported both improvements before --update), jest 321/321 in 25 suites, type-check 0 errors (no TS changes), production build unaffected (styles.css ships as-is, src/ untouched)"
  - version: "1.7.0"
    other:
      - "Phase 3 (Platform) starts with its CSS gate: a stylelint ratchet mirroring the ESLint one from 1.5.5. .stylelintrc.json enables a correctness rule set (invalid hex, duplicate selectors, empty blocks, unknown units/properties/pseudo-classes/pseudo-elements/at-rules/media features, calc spacing, shorthand overrides, duplicate font families, duplicate properties with fallback tolerance, irregular whitespace, empty sources/comments, string newlines, invalid named grid areas) plus declaration-no-important and keyframe-declaration-no-important - the phase-3 !important target. The measured debt matches the long-tracked grep count exactly: 311 !important in styles.css, plus 4 no-duplicate-selectors and 1 block-no-empty = 316 violations frozen in stylelint-baseline.json; every other enabled rule is already at zero. New violations fail CI (pnpm lint:css:ratchet, a ci.yml step next to the ESLint ratchet); burn-downs must shrink the baseline in the same commit (--update), exactly like eslint-baseline.json. The ratchet script (scripts/stylelint-ratchet.mjs) uses the stylelint Node API, tracks error severity per file/rule, maps parse errors to a (parse) pseudo-rule and exits 2 on invalid rule options, so a config typo can never silently pass the gate"
      - "pnpm lint:css added as the verbose human-facing run (every frozen violation with line numbers; exits non-zero until the debt burns down - by design, CI uses the ratchet). No CSS was touched: styles.css and main.js are byte-identical to 1.6.24; the !important burn-down with theme checks (Minimal, Things, light/dark) follows in 1.7.x now that the debt cannot grow"
      - "Docs: the ROADMAP phase-3 status records the gate (item 4 partially done, item 3 gated, phase re-anchored to 1.7.x, acceptance checklist updated), MAINTAINING.md documents the CSS ratchet next to the ESLint one (including the stylelint-CLI-printing-its-report-to-stderr-through-pnpm-exec quirk; the ratchet script uses the Node API and is unaffected)"
      - "Gates: jest 321/321 in 25 suites unchanged (no src/ changes), type-check 0 errors, stylelint ratchet green against the fresh baseline and idempotent under --update, negative case verified end-to-end (an injected !important fails the check with exit 1 and a REGRESSION line; the revert restores green and styles.css stays byte-identical); the ESLint ratchet was not re-run locally (no .ts/.tsx file is touched by this release and the local sandbox hits its memory ceiling on the type-aware run - CI re-verifies it on push, as for every past release)"
  - version: "1.6.24"
    fixes:
      - "Streaming a manage_files block no longer floods the console with red stack traces. Field report: renaming a note in Write mode worked, but every streamed chunk printed '[icf] Failed to parse manage_files operations JSON / JSON5: invalid end of input at L:C' (~25-35 errors per block). ReactMarkdown re-parses the message on every token (useMemo over children), and parseMsgBlocks fed the still-truncated <operations> payload to JSON5.parse, logging the failure with logger.error. The last error of such a stream is 'invalid character <': when the buffer stops between ] and </operations, parse5 follows the HTML spec and emits the partial closing tag as text, so the slice is a complete JSON array followed by markup. An unparseable payload in an UNFINISHED block is now a debug-level line (visible only with Debug mode on), a best-effort completion (string-aware bracket closing, unterminated tail dropped rather than guessed) plus markdown code-fence stripping let the block show the operations that already arrived, and a payload that is still broken once the block IS finished keeps the error log. search_and_replace and insert_content payloads - which spammed identically - get the same treatment; the search_and_replace streaming test that used to pin the error log now pins the silence"
      - "A manage_files block no longer flashes bogus warnings while it streams: droppedOperations was set to 1 on every truncated payload, so the chat showed 'File operations (0)' plus 'Skipped unsupported operations: 1' until the closing tag arrived. Dropped entries are only counted for a finished block, the warning rows render only then, and an unfinished block shows a 'Receiving operations...' row instead. The Execute button still requires finish === true, so a partially streamed list can never be executed"
      - "CAPABILITIES stopped advertising tools the mode does not have - the root cause of the Ask-mode 'File operations (0)' report. The section claimed 'You have access to the manage_files tool' for every mode, including Ask (groups read/insights/mcp), while the tool description carrying the schema is injected only for modes that have the tool: the model believed it could manage files, invented a payload shape (```json fences, rename_file with old_path/new_path, prose, write_to_file-style sub-tags) and the validator dropped every entry. Each bullet is now gated by isToolAllowedForMode(tool, mode, customModes); a mode without the tool receives an explicit instruction to say the mode is read-only and suggest switch_mode instead of emitting the block. The Learn-mode 'You have access to file management tools' claim is gone the same way, and the MCP bullet - dead code, enableMcpHub was never passed down - now follows the mode's mcp group"
      - "The manage_files tool description documents all five actions. Parameters/Actions listed only move, delete and create_folder, so rename and copy - fully supported by the parser and the executor - had no documented field names and models guessed them (path/new_name, source_path/destination_path). The description now lists every action with its required fields, states the vault path rules (vault-relative, forward slashes, no './' or leading '/'), asks for bare JSON without code fences, explains that the result reports every operation separately, and shows rename and copy in the examples"
      - "manage_files is now gated by mode at execution time, not only in the prompt. isToolAllowedForMode was consulted solely while the system prompt was assembled, so any block that reached the chat could mutate the vault with one click - including in Ask, and including a block left over from a conversation started in Write mode and continued after a switch. checkManageFilesPermission(mode, customModes) runs first in the ChatView apply branch; a blocked call returns ApplyStatus.Failed and a tool_result telling the model that nothing changed, that the mode toolset is fixed, and that it should explain the limitation and suggest switch_mode instead of re-emitting the block"
      - "manage_files executor: an operation that validated but lost its required fields is now an explicit failure. The model writing from/to instead of source_path/destination_path produced {action:'move'} with no paths, which fell through the 'if (operation.source_path && operation.destination_path)' guard silently: no result line at all, an empty report and an applied status - the same false-success class the 1.6.22 release fixed for the empty list, one level down. Missing fields are reported per operation ('Skipped move: missing required field(s): source_path, destination_path') and count as failures"
      - "manage_files executor: one throwing operation no longer aborts the batch and no longer discards the report of the operations that already ran. The whole loop sat in a single try/catch and 'results' lived inside it, so an exception on operation 2 returned only 'File management failed: <error>' - the model could not tell that operation 1 had already renamed a file and happily repeated it. Each operation now runs in its own try/catch, the batch always reports every line, and the status is applied (all succeeded), partial (some) or failed (none), with ok/failed counts; ChatView maps partial and failed to ApplyStatus.Failed so a batch never looks like a clean success"
      - "Renames and moves go through FileManager.renameFile when the host exposes it: obsidian.d.ts documents Vault.rename as 'Rename or move a file. To ensure links are automatically renamed, use FileManager.renameFile instead', so renaming a note left every [[wikilink]] and embed in the vault pointing at the old name"
      - "copy uses the binary vault APIs (readBinary/createBinary) when available - the plaintext read/create round-trip mangled attachments (png, pdf and anything else Vault.read is not meant for). Both new dependencies are optional members of the ManageFilesApp bridge narrowed by type guards, so no type assertions were added"
      - "Paths coming from the model are normalized to vault paths (normalizeVaultPath: backslashes to '/', collapsed duplicates, no './', no leading or trailing '/') and paths containing '..' segments are rejected outright. A Windows-style 'Notes\\a.md' used to fail as 'file does not exist' while the batch still reported applied; '..' would have let a note talk the model into moving files outside their folder"
      - "move/copy/rename check the destination before touching the vault: an occupied destination is a per-operation failure line ('Destination already exists: X') instead of a Vault exception that aborted the whole batch. A rename to the current name is reported as an explicit no-op success"
      - "A batch containing delete operations asks for confirmation first (showConfirm, danger styling, the affected paths listed) - unlike write_to_file and apply_diff this block has no preview step, so one click used to trash files immediately. Rejecting returns ApplyStatus.Rejected and a tool_result telling the model that nothing was changed"
    other:
