releases:
  - version: "1.1.1"
    fixes:
      - "Catalog submission compliance: the settings heading in the mobile placeholder tab no longer includes the plugin name (checker rule 'Avoid including the plugin name in settings headings')"
  - version: "1.1.0"
    features:
      - "Ollama is now a first-class local provider: the model picker lists models pulled from your Ollama server (/api/tags) instead of requiring manual entry"
      - "New defaults for fresh installs: Ollama for chat/insight/apply models and the on-device LocalProvider for embeddings - no API key or cloud service required"
    fixes:
      - "Removed the discontinued Infio cloud provider entirely: no more calls to api.infio.app (model list, subscription/plan checks), no device-id reporting code, no dead Pro/API-key modals; the cloud-backed built-in MCP server is gone (user-configured MCP servers are unaffected)"
      - "Reading non-Markdown files and web pages no longer depends on the dead cloud conversion service: mentions fall back to file metadata, YouTube transcripts and HTML-to-Markdown"
      - "manifest.json now honestly declares isDesktopOnly until real mobile support lands (the mobile build previously only showed a settings tab for the discontinued service)"
      - "About-panel and zh-CN README links pointed at dead or upstream-only pages; they now point to this repository and its issue tracker"
    other:
      - "Settings schema 0.6 with automatic migration: stored Infio selections are remapped to Ollama (chat/insight/apply) and to LocalProvider with the local TaylorAI/bge-micro-v2 embedding model, stale Infio model ids are cleared, collected-model lists are filtered instead of discarded, and Infio credentials are deleted from plugin data"
      - "Dependency diet: unused @huggingface/transformers removed (53 fewer installed packages); dead checkGeneral/device-id code removed"
      - "Contributor docs match CI again (pnpm 12); public roadmap added as ROADMAP.md"
  - version: "1.0.7"
    fixes:
      - "Catalog review polish: window-scoped timers, Obsidian DOM helpers (createDiv/createSpan/createEl), trashFile instead of vault delete/trash, requestUrl for simple GET/POST calls, popout-safe helpers, deprecated substr/JSX namespace removed, unused imports and dead locals cleaned, thrown rejections normalized to Error, switch-case lexical scopes fixed"
    other:
      - "Deep type-safety warnings (no-unsafe-* family), guarded Node built-in imports and the declarative settings API are deferred to the roadmap with written rationale (advisory-only categories)"
  - version: "1.0.6"
    fixes:
      - "Catalog review compliance: all floating promises are now explicitly marked with the void operator (no behavior change, fire-and-forget semantics preserved)"
  - version: "1.0.5"
    fixes:
      - "CSS review compliance: removed duplicate declarations, replaced clip-path spinner animation, scrollbar-width and multi-column props with broadly supported equivalents, removed 'all: unset'"
      - "Dependency advisories: dropped unused drizzle-orm, bumped langchain/diff/MCP SDK within API-stable lines, added pnpm overrides for transitive packages (minimatch, picomatch, qs, form-data, follow-redirects, ws, nanoid, prismjs, protobufjs, dompurify and others)"
    other:
      - "Lockfile refresh deferred to maintainer machine/CI: run pnpm install and commit pnpm-lock.yaml"
      - "Build tooling: pnpm 12 config via pnpm-workspace.yaml (overrides moved out of package.json, exotic git subdeps allowed); unused plausible-tracker analytics dependency removed; uuid moved to v11"
  - version: "1.0.4"
    fixes:
      - "Replaced deprecated/unused dependencies flagged by the catalog review: axios and js-yaml removed, lodash/lodash.debounce/lodash.isequal replaced by a small local utility module, builtin-modules replaced by node:module, deprecated eslint plugins dropped"
    other:
      - "Bundle is ~90 KB smaller; no user-facing behavior changes"
  - version: "1.0.3"
    fixes:
      - "Obsidian catalog review compliance: all eslint directives now carry descriptions, forbidden rule disables removed, innerHTML and direct style assignments replaced with DOMParser/CSS-class approaches, settings headings use the Setting API"
    other:
      - "Code-quality pass only; no user-facing behavior changes"
  - version: "1.0.2"
    fixes:
      - "Removed the legacy self-update mechanism (download/extract/overwrite own files and programmatic plugin reload) flagged by the Obsidian catalog review"
      - "Removed node-machine-id hardware fingerprinting; device id is now a locally persisted random pseudo-id"
    other:
      - "Dropped jszip dependency and the Pro-upgrade UI of the discontinued Infio service"
      - "Release assets now ship with GitHub artifact attestations (build provenance)"
  - version: "1.0.0"
    features:
      - "Independent project: rebranded to Infio Copilot Free (plugin id infio-copilot-free, author MidliBob)"
      - "UI styles, view types and storage keys moved to the icf-* namespace"
    fixes:
      - "Settings tab lookup and plugin-folder asset loading now use the new plugin id"
    other:
      - "Lineage: community continuation of Infio Copilot 0.8.x (Felix.D), itself a fork of Smart Composer (Heesu Suh); MIT"
      - "Breaking for custom CSS snippets: class prefix changed from infio- to icf-"
      - "Chat/vector database keeps its storage name (infio-db) for data continuity; do not run the original Infio Copilot simultaneously"
  - version: "0.8.7"
    fixes:
      - "PGlite database assets now ship with the plugin (local files + CDN fallback); the previous remote host is gone, which broke the plugin on start-up"
      - "model picker no longer throws when opening the dropdown (null currentTarget)"
      - "no more 401 spam from the Infio model list when no Infio API key is set"
    features:
      - "complete Russian (ru) interface translation"
    other:
      - "removed client-side telemetry for Obsidian developer policy compliance"
