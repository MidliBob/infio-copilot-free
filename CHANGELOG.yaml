releases:
  - version: "1.6.12"
    fixes:
      - "The 1.6.11 fetch proxy no longer confuses its own answers with commands: the worker's main message listener ignored fetch-response messages, so every proxied download also ran through processMessage and threw 'Unknown method: undefined' into the console; responses are now routed to the proxy listener only"
      - "Proxied downloads carry Content-Type again (alongside Content-Length): without it the ONNX Runtime wasm streaming compile failed with 'Incorrect response MIME type. Expected application/wasm' and fell back to slower ArrayBuffer instantiation; a protocol test now guards the header"
      - "The transient 'TransEngine: embedding model or insight manager not available' warning (startup, or while a model load is failing) is logged at debug level - the actionable details and the one-click-configuration hint that follow it were already debug-level"
    other:
      - "Field note: 'Cannot reach endpoint https://huggingface.co: net::ERR_CONNECTION_CLOSED' means the user's network blocks Hugging Face; the endpoint probe fails honestly and the worker switches to the mirror, which the proxy now serves without CORS problems"
      - "Unit tests: 172 total (the protocol suite grew a Content-Type regression guard); Jest console clean; lint ratchet baselines of the touched files unchanged"
  - version: "1.6.11"
    fixes:
      - "Local-provider model downloads no longer die on CORS-blocked mirrors: when huggingface.co is unreachable the worker falls back to hf-mirror.com, which sends no Access-Control-Allow-Origin headers, and the worker's plain fetch was blocked for origin app://obsidian.md ('Failed to fetch', then the circuit breaker). Model and endpoint requests now go through a fetch proxy: the worker posts fetch-request messages and the main thread performs them with requestUrl (native HTTP, CORS-free), transferring the bytes back as an ArrayBuffer; blob/data URLs stay native. With useBrowserCache already on, a successfully loaded model is then served from the IndexedDB cache without network"
      - "Ripgrep spawn failures now suggest installing ripgrep when it is missing (the real-world Windows case): the error names the binary, the settings page and, per platform, 'winget install BurntSushi.ripgrep.MSVC' (PowerShell) or the macOS/Linux package managers; the same install instruction is shown in the Ripgrep path setting description (en/ru/zh-cn)"
    other:
      - "New src/embedworker/fetch-proxy-protocol.ts carries the proxy protocol as pure functions (performFetchProxyRequest, responseFromFetchProxy, message guards) and is covered by 6 unit tests; total 172 tests, Jest console clean"
      - "The worker endpoint reachability probe also runs through the proxy now, with the timeout applied by requestUrl on the main thread; the last type assertion left in embed.worker.ts is gone (baseline 1076 errors in 125 files)"
  - version: "1.6.10"
    fixes:
      - "Ripgrep backend failures are actionable now: a spawn error (missing binary, permissions, wrong path - the common Windows case) reports the exact binary used and points to Settings -> Infio Copilot Free -> Files search, or to switching the regex backend to the built-in plugin; previously the tool answer was a bare 'ripgrep process error: <syscall>'"
      - "Context lines in ripgrep output keep the pre-1.6.9 placement when a result has no line number yet (afterContext), restoring exact legacy behavior alongside the assertion-free parsing"
    other:
      - "Console hygiene for local-provider indexing: the embedding worker's 24 routine per-message logs moved to console.debug (hidden under DevTools default levels, warn/error stay visible), EmbeddingManager (main thread) moved onto the logger facade (also clearing its validator 'avoid console logging' warnings), and the known-benign transformers.js 'Unable to determine content-length' warn is suppressed for the duration of a model load only"
      - "MAINTAINING.md records the worker logging policy and the deferred register: no-misused-promises void-wrapping, the no-unsafe-*/any burn-down (phase 2 pass 3), SSE -> StreamableHTTP and the declarative Settings API (phase 3), and the typescript-eslint 'unsupported TypeScript version' banner (migration to typescript-eslint v8 under the phase-3 lint-gate hardening)"
      - "No behavior change beyond the described messages; 166 tests, type-check, lint ratchet (1077 errors in 125 files) and the production build all green"
  - version: "1.6.9"
    fixes:
      - "Obsidian validator quick-wins: cross-window instanceOf instead of instanceof HTMLElement; the ripgrep exclusion glob now uses Vault#configDir instead of a hardcoded '.obsidian' (and its non-null assertions are gone); the debug gc hook no longer touches 'global' or casts; bare setTimeout became window.setTimeout; the deprecated onnx wasm.simd flag is dropped; the embedding-dimension probe checks 'undefined' instead of Promise truthiness; the PGlite live types resolve without @ts-expect-error; enum-to-string comparisons go through toString(); the error-notice layer now builds its DOM with Obsidian's createFragment/createDiv/createEl helpers per plugin guidelines"
      - "The release-notes tooling moved from js-yaml (flagged by the validator's module-replacements list) to the yaml package; package.json no longer mentions js-yaml"
    other:
      - "Validator recommendations cleaned where free: unused destructurings/catch parameters/imports removed, 'catch {}' adopted, and the unavoidable warnings (worker fetch/globalThis/setTimeout, logger globalThis, the OLLAMA_ORIGINS stage-2 fetch) are documented with written justification in MAINTAINING.md for catalog review"
      - "Frozen debt shrank as casts and any-chains disappeared along the way: eslint baseline 1132 -> 1077 errors in 125 files (vector-manager 63 -> 39, ripgrep-regex 27 -> 21, database-manager 7 -> 2 among others); ts-suppressions 77 -> 76"
      - "Unit tests: 166 total, Jest console clean; the error-notice suite gained a cast-free jsdom polyfill of the Obsidian dom extensions"
      - "Deliberately deferred and tracked: void-wrapping async JSX handlers (no-misused-promises), the remaining no-unsafe-*/any debt (phase 2 pass 3), SSE -> StreamableHTTP and the declarative Settings API (phase 3)"
  - version: "1.6.8"
    fixes:
      - "Type-check regression from 1.6.7: 'App.plugins' does not exist in Obsidian's public typings (TS2339), so reading the plugin registry there was rejected by tsc. The registry is now read reflectively into an unknown value (Reflect.get) and validated structurally by getDataviewApi - no casts, no global App augmentation, and an unexpected shape still yields the graceful 'Dataview plugin is not installed' path"
    other:
      - "Release verification now runs every gate with explicit exit codes after a masked pipeline (tsc output piped into tail) briefly hid this regression internally; all gates re-run green: type-check 0, 166/166 tests, lint ratchet unchanged, production build"
  - version: "1.6.7"
    fixes:
      - "The last eight audit findings are gone (pnpm audit is now completely clean): esbuild 0.17.3 (2023) upgraded to 0.28.2 with the transitive chains (ts-jest, drizzle-kit) overridden - this closes GHSA-67mh-4wv8-2f99 and completes the esbuild-plugin-inline-worker compatibility check planned for phase 4; and the obsidian-dataview devDependency is removed together with its obsidian-calendar-ui/svelte/preact chain (seven svelte advisories), which the Obsidian validator kept flagging"
      - "Dataview integration no longer bundles third-party compiled code: the API (queryMarkdown/evaluate only) is resolved at runtime through the Obsidian plugin registry with a structural type guard, keeping the previous behavior when Dataview is absent or exposes a different shape; typed result handling replaced the foreign Result any-fields and burned the file's whole eslint debt (21 -> 0, baseline now 1132 in 127 files)"
    other:
      - "New unit tests for the Dataview API guard (4): missing plugin, missing api field, incomplete api surface, matching surface; total 166 tests, Jest console clean"
      - "Bundle size unchanged by this release (~16 MB); the esbuild upgrade is a prerequisite for the phase 4 bundle diet (lazy mermaid, target below 10 MB)"
      - "Lockfile regenerated with pnpm 12 - pnpm install is required after applying"
  - version: "1.6.6"
    fixes:
      - "Security: every dependency flagged by the Obsidian plugin validator is updated past its advisory - mermaid 11.8.0 -> 11.17.2 (the XSS / prototype-pollution / DoS batch including GHSA-8gwm-58g9-j8pw, the architecture-diagram iconText XSS), handlebars 4.7.8 -> 4.7.9 (two critical JavaScript-injection advisories), simple-git 3.28.0 -> 3.36.0 (critical RCE and unsafe-operations bypass; simple-git ships in the bundle for the diff strategies), uuid -> 11.1.1 (buffer bounds check), lodash-es -> 4.18.1 (code injection and prototype pollution), sharp -> 0.35.4 (inherited libvips/libheif CVEs), postcss -> 8.5.28, path-to-regexp -> 8.4.2, ajv -> 6.15.0 / 8.20.0 and fast-uri -> 3.1.8 (ReDoS and host-confusion advisories)"
    other:
      - "pnpm audit after the update: 0 critical / 0 high (was 2 critical / 29 high). The remaining moderates are dev-only and never bundled: svelte 3.x (its remaining advisories are fixed only in the 5.x line, which obsidian-calendar-ui cannot consume) and esbuild (the bundler upgrade is roadmap phase 4 work) - both are documented rationales for catalog review, not oversights"
      - "js-yaml is now a direct devDependency at 4.3.2: the release-notes script no longer needs the NODE_PATH pnpm-store workaround"
      - "The bundle grew by about 1 MB (main.js ~16 MB) with mermaid 11.17 - tracked under phase 4 (lazy mermaid import, target below 10 MB)"
      - "No plugin code changed: 162 tests, type-check, lint ratchet (1153 errors in 128 files) and the production build all stay green; the lockfile is regenerated with pnpm 12, so pnpm install is required after applying"
  - version: "1.6.5"
    fixes:
      - "Stopping a generation (or sending a new message, switching conversations, starting a new chat, closing the chat tab) no longer reports an error: the OpenAI SDK wraps a caller-aborted stream into APIUserAbortError ('Request was aborted.') whose error name stays the generic 'Error', so the chat mutation's AbortError check missed it and every intentional cancellation surfaced as a 'Request was aborted.' notice plus an error log. Cancellations are now recognized and handled silently - the partially streamed answer stays in the history, exactly like the previous raw-AbortError path"
    other:
      - "New src/utils/abort-errors.ts: isCancellation() recognizes the SDK abort wrapper (instanceof, plus name/message fallbacks for cross-realm copies) and raw DOM AbortErrors; SDK timeouts ('Request timed out.') are deliberately NOT cancellations and keep surfacing as failures"
      - "The chat mutation's onError is guarded by the same predicate as a second line of defense"
      - "Unit tests: 162 total (4 new for isCancellation); the Jest console output stays clean. Lint ratchet: one violation burned down along the way (the removed implicit-any member access) - debt is now 1153 errors in 128 files"
  - version: "1.6.4"
    fixes:
      - "Autocomplete leaked an unhandled rejection on every keystroke while the chat endpoint was down: the autocomplete LLM client declared a neverthrow Result contract but had no catch, so the thrown transport error escaped past fetchPredictions/predict into 'Uncaught (in promise)'. The client now delegates to a breaker-backed helper that never throws, restoring the declared contract by construction"
      - "Background chat-API consumers stop hammering a dead server: autocomplete (per keystroke) and workspace insights (per file and folder across the whole vault, each with its own retry budget) now share a session-scoped circuit breaker - three consecutive connection failures open it for 30 s and no HTTP request is attempted while open; any server answer or success closes it. Insights initialization aborts as a whole instead of warning once per file, and its failure surfaces as a once-per-session notice with the extracted 'Cannot reach ...' cause"
      - "Autocomplete fails silently (debug log only) on transport errors instead of stacking a 'Something went wrong' notice per keystroke; non-transport errors keep the notice"
    other:
      - "New src/utils/llm-circuit.ts: the session breaker plus streamChatWithBreaker(), the single accumulation+breaker helper both chat clients (autocomplete and transformations) delegate to; user-initiated chat sends intentionally bypass the breaker and surface their own errors, while a success there closes the circuit"
      - "New i18n key errors.insightsInitFailed added in sync across en/ru/zh-cn"
      - "Unit tests: 158 total (5 new for the breaker-backed chat helper: accumulation, err-instead-of-throw, open-circuit skips the network, application errors never trip, closing after a successful probe); the Jest console output stays clean"
      - "Lint ratchet: no regressions - the touched debt-free files stay at zero, total debt unchanged at 1154 errors in 128 files"
  - version: "1.6.3"
    fixes:
      - "Error notices rendered as empty black pills: Obsidian's Notice ingests a DocumentFragment at construction time (its nodes are moved into the notice element), but the error layer passed the fragment in before populating it - and appended the action buttons even later, so neither the text nor the Retry button ever reached the DOM. The field symptom after 1.6.2: the breaker aborted indexing cleanly with the full actionable message in the console, while the notice meant to show it was blank. The fragment is now fully populated (title, explanation, detail, action row) before new Notice(...)"
    other:
      - "The Jest Notice mock is now faithful to Obsidian (it moves the fragment's nodes into a message element inside the constructor) and every assertion reads through that element, so this class of ordering bug fails the suite: with the old assembly order four tests go red, with the fix all 153 pass"
  - version: "1.6.2"
    fixes:
      - "Indexing a vault against a stopped embedding server no longer hammers it and no longer pretends to succeed: every chunk used to burn its full retry budget (3 backoff attempts x up to 3 SDK HTTP attempts each - hundreds of pointless connection-refused requests on a real vault), and because per-chunk errors were swallowed, the vault/workspace index 'completed' with zero vectors and only a flooded console. A circuit breaker (trips after 3 consecutive connection-level failures, 30 s half-open cooldown) now aborts the whole operation within seconds with the actionable provider message from 1.6.1, which the error-notice layer surfaces with a Retry button"
      - "backOff no longer retries an open circuit (a retry predicate stops on CircuitOpenError), and chunk tasks still queued in the concurrency limiter short-circuit without touching the network; Promise.allSettled keeps their rejections from escaping as unhandled"
    other:
      - "The breaker guards connectivity only, not correctness: any server response (even HTTP 500/429/'model not found') counts as reachable and resets it, so a single flaky chunk still retries exactly as before; after the cooldown one probe request is allowed through, and a success fully closes the circuit"
      - "network-errors.ts gained isNetworkFailure() (transport-level classification of caught values, including the plugin's own 'Cannot reach ...' wording); extractErrorMessage() moved there from error-notice.ts and is re-exported for API compatibility"
      - "The single-file indexing path (UpdateFileVectorIndex) is intentionally untouched - it already fails fast via its AbortController"
      - "Unit tests: 153 total (16 new: breaker thresholds, resets, half-open on an injected clock, callWithBreaker short-circuiting, isNetworkFailure and extractErrorMessage); the Jest console output stays clean"
      - "Lint ratchet: no regressions - vector-manager.ts stays exactly at its frozen baseline (63), the new files are clean; total debt unchanged at 1154 errors in 128 files"
  - version: "1.6.1"
    fixes:
      - "A stopped Ollama server is finally explained instead of reported as the opaque 'Connection error.': the OpenAI SDK wraps every transport failure (ERR_CONNECTION_REFUSED included) into APIConnectionError with that default message, and the network-failure classifier did not know the wording, so the actionable hint prepared in 1.1.x never surfaced. The classifier (now shared in src/utils/network-errors.ts) also matches 'Request timed out.', which fixes chat, embeddings, indexing and the embedding-dimension probe alike - they now say 'Cannot reach Ollama at <url>' with the ollama serve / OLLAMA_ORIGINS / Test-connection steps"
      - "Embeddings through a custom OpenAI-compatible endpoint (vLLM, LM Studio, llama.cpp, corporate proxy) got the same treatment: an unreachable server is described as 'Cannot reach the OpenAI-compatible endpoint at <url>. Make sure the server is running and the base URL in the plugin settings is correct.' HTTP-level failures (401/404/429) keep the server's own wording, and the 429 rate-limit path is unchanged"
      - "Embedding-server failures at startup no longer live only in the developer console: the semantic search tab shows a 'Semantic search is unavailable' notice with the extracted cause and a Retry button (once per session for the automatic statistics load), and a failed manual vector-index initialization shows a notice with Retry that restarts the indexing"
    other:
      - "The error-notice layer (1.6.0) gained showErrorNoticeOnce(key, ...) for automatic background failures: the first occurrence is shown, repeats are only logged, and the standard Retry action resets the key so a user-triggered attempt always gets fresh feedback"
      - "New i18n keys errors.semanticSearchUnavailable and errors.ragInitFailed added in sync across en/ru/zh-cn (the locale-completeness test enforces it)"
      - "Unit tests: 137 total (16 new: the shared network-failure classifier, the exact SDK wordings seen in the field, once-per-session semantics); the Jest console output stays clean"
      - "Lint ratchet: no regressions - the frozen debt stays at 1154 errors in 128 files; the two catch variables touched in the search view are typed unknown instead of implicit any"
  - version: "1.6.0"
    features:
      - "Actionable error notices: a unified error layer renders failures as styled notices (themed error title, explanation, monospace detail extracted from the caught value) with optional action buttons. Vault index rebuild/update failures now offer a one-click Retry instead of a bare 'failed' line; the JSON-storage migration failure shows the real reason. Full error objects still go to the logging facade (visible in the developer console, Debug mode for verbose output)"
      - "TypeScript suppression ratchet: every @ts-nocheck / @ts-ignore / @ts-expect-error under src/ is inventoried (docs/ts-suppressions.md, 77 markers in 30 files after this release) and frozen in ts-suppressions-baseline.json; a Jest test fails CI on any new suppression - and on a burned-down one until the baseline is shrunk in the same commit"
    fixes:
      - "src/main.ts no longer hides behind a blanket @ts-nocheck (core-module policy): the plugin entry point type-checks cleanly without it; the next candidate (src/main.desktop.ts) is documented in the inventory"
      - "The t() translation helper is strictly typed - (str, params?: Record<string, unknown>): string instead of any/any: unknown keys resolving to a section now return the key path instead of rendering '[object Object]', and the honest return type rippled through the codebase, burning down 377 unsafe-any lint violations in one pass (frozen debt: 1531 -> 1154)"
      - "McpHubView: two 'as string' assertions made redundant by the typed t() removed (the new lint ratchet caught them), and raw error.message in the server-creation failure notice replaced with the safe extractErrorMessage() helper"
    other:
      - "ESLint debt ledger after this release: 1154 errors in 128 files (was 1531/152 at the 1.5.5 freeze); biggest burn-downs from the t() ripple: SettingTab.tsx (unsafe-argument 67 -> 2), trans-engine.ts (34 -> 0), the Markdown tool-result blocks and InlineEdit (unsafe-call/member-access zeroed)"
      - "New i18n key errors.retry added to en/ru/zh-cn in sync (the locale-completeness test enforces it)"
      - "Unit tests: 121 total (16 new: 13 for the error-notice layer running in jsdom, 3 for the suppression ratchet); the Jest console output stays clean"
      - "No behavior change beyond the described notice upgrades; bundle size unchanged (~15 MB, phase 4 target)"
  - version: "1.5.5"
    fixes:
      - "ESLint had been crashing before evaluating a single rule since the pnpm 12 config move: the dependency overrides forced brace-expansion 2.x under minimatch 10, which expects the v5 API, so any brace glob (including the lint script's own 'src/**/*.{ts,tsx}') died with 'expand is not a function'. The brace-expansion override is removed - the only consumer in the tree is minimatch 10, which now resolves brace-expansion 5.0.12 (newer than every patched release of the ReDoS CVE the override was guarding)"
      - "src/utils/icon.d.ts deleted: an orphaned duplicate of src/utils/icon.ts that TypeScript never includes in the compilation program (the real implementation shadows it), which made ESLint fail parsing with 'TSConfig does not include this file'"
    other:
      - "The lint gate is now a ratchet: the full type-aware scan found 1531 pre-existing errors in 152 files (mostly upstream style debt plus 1134 no-unsafe-* violations), frozen in eslint-baseline.json. 'pnpm lint:ratchet' (scripts/lint-ratchet.mjs) fails CI on any NEW violation, prints improvements and shrinks the baseline with --update; --batch=N runs chunks in child processes for low-memory machines. 'pnpm lint' still shows the raw red picture until the debt burns down"
      - "CI now also runs on pushes to master (previously pull-request-only, so with direct pushes the gate never executed - which is why the broken lint went unnoticed for a week); duplicate runs are cancelled via concurrency"
      - "MAINTAINING.md: the CI section rewritten for the ratchet workflow; the stale 'Roadmap (next releases)' section (dead Infio provider, 'more locales' - both long resolved differently) replaced with a pointer to ROADMAP.md"
      - "ROADMAP.md synchronized with reality: a release-history table (0.8.7 -> 1.5.5, including the free/self-hosted pivot of 1.4.0-1.5.4), phases re-mapped (phase 0 done; phase 2 pass 2 -> 1.6.0 with fresh debt measurements; phase 3 -> 1.7.0; phase 4 -> 1.8.0; mobile parity -> 2.0.0), acceptance checklist updated"
      - "No plugin behavior change; unit tests: 105 total, the Jest console output stays clean"
  - version: "1.5.4"
    features:
      - "The custom OpenAI-compatible endpoint is back: 1.5.3 dropped it together with the cloud providers, but unlike them it is not tied to any particular service - you supply the base URL and the API key yourself, so it covers local servers (vLLM, LM Studio, llama.cpp, LocalAI), corporate proxies and any other OpenAI-compatible backend; it can again be picked for chat, insights, autocomplete and embeddings"
    other:
      - "The 0.8 -> 0.9 migration no longer counts OpenAICompatible among the removed providers, so a stored custom endpoint survives the upgrade; the settings schema version stays 0.9 and desktop/mobile schemas stay in sync. If you already launched 1.5.3, that release deleted the card - fill in the base URL and the key once more, or restore data.json from a backup"
      - "Unit tests: 105 total (1 added for the custom-endpoint migration path); the Jest console output stays clean; the bundle grows by 2 KB"
      - "README (English, Russian and Simplified Chinese) now lists the providers the plugin actually ships - the clouds removed in 1.5.3 were still advertised in the feature list"
  - version: "1.5.3"
    features:
      - "Seven cloud LLM providers removed - OpenAI, Anthropic, Google (Gemini), Groq, Grok, OpenRouter and the custom OpenAI-compatible endpoint: none of these clouds is reachable or used by the maintainer. The plugin now ships six providers: Ollama (the primary local server), Deepseek, SiliconFlow, AlibabaQwen, Moonshot and LocalProvider (local transformers.js embeddings)"
    other:
      - "Settings schema 0.9 (was 0.8): stored selections of the removed providers migrate to Ollama (chat/insight/apply) and LocalProvider (embeddings, model TaylorAI/bge-micro-v2); their API keys, provider cards and collected model entries are dropped on the first start; Ollama and the remaining providers keep their configuration; desktop and mobile schemas stay in sync"
      - "The npm dependencies @anthropic-ai/sdk, @google/genai, @google/generative-ai and groq-sdk are gone; about 2500 lines of provider handlers, model catalogs and settings schemas removed, the bundle shrinks accordingly"
      - "Unit tests: 104 total (3 OpenRouter parser tests removed, 2 added for the 0.8 -> 0.9 migration); the Jest console output stays clean"
  - version: "1.5.2"
    fixes:
      - "Web search no longer fails when the engine returns results without a snippet: the relevance filter falls back to the result title, drops results with no text at all, and logs a warning instead of aborting the whole search when a single result cannot be embedded - previously any empty snippet killed the search with \"Text cannot be empty\" when the local (transformers.js) embedding model was in use"
      - "A blank search query is now answered directly instead of being sent to the search engine and the embedder"
    other:
      - "3 new unit tests (105 total) covering empty-snippet results, per-result embedding failures and the blank-query guard; the Jest console output stays clean"
  - version: "1.5.1"
    features:
      - "The Tavily web search provider is removed: its cloud API became unreachable for users, so web search is now served only by self-hosted engines - SearXNG (the new default) and YaCy - neither of which needs an API key; stored Tavily settings (the provider choice and the API key) migrate away automatically on the first start"
    other:
      - "Settings schema 0.8 (was 0.7): the migration drops the stored Tavily key and re-selects the default search provider; an explicit YaCy choice and its peer URL survive; desktop and mobile schemas stay in sync"
      - "Clicking a web search block in chat now always opens the query in your own search engine's UI - the Google fallback that served the API-only provider is gone"
      - "Unit tests: 102 total (5 Tavily tests removed, 2 added for the 0.7 -> 0.8 migration); the Jest console output stays clean"
  - version: "1.5.0"
    features:
      - "SearXNG added as a third web search provider alongside Tavily and YaCy: Settings -> Web search lets you point the plugin at your own SearXNG instance (default http://localhost:8080); like YaCy it is self-hosted and needs no API key, and clicking a web search block in chat opens the query in the instance's own UI"
    other:
      - "The SearXNG instance must allow the JSON output format (add \"json\" to search.formats in its settings.yml, see https://docs.searxng.org/dev/search_api.html) - a 403 response is logged with an explicit hint about this requirement"
      - "6 new unit tests (105 total): SearXNG URL normalization, result mapping, the 403 / non-JSON / instance-down failure paths and provider settings round-trip; the Jest console output stays clean"
  - version: "1.4.0"
    features:
      - "Web search providers replaced: Serper and Jina (unavailable in some regions) are removed; Settings -> Web search now lets you choose between Tavily (cloud search API for LLM tools, free tier of 1000 searches per month) and YaCy (self-hosted decentralized search engine that needs no API key and no third-party cloud); existing settings migrate automatically"
    fixes:
      - "fetch_urls_content and the page-fetching step of search_web no longer depend on the Jina reader API - pages are always fetched and converted to markdown locally through Obsidian's requestUrl, so both tools work in every region"
      - "Web search failure modes are now explicit: a missing Tavily key, an unreachable YaCy peer or an empty result set return a descriptive message to the model instead of an empty tool result"
    other:
      - "webSearch() now depends on a narrow embedding interface instead of the whole RAG engine; Tavily and YaCy responses are validated with Zod schemas at the boundary; 13 new unit tests (98 total)"
  - version: "1.3.1"
    fixes:
      - "Catalog compliance: the 'no-bitwise' eslint-disable directive in the pure-TypeScript MD5 module now carries a description and a paired eslint-enable, as the Obsidian plugin source-code checker requires - no behavior change, cache hashes are byte-identical"
  - version: "1.3.0"
    features:
      - "Reliability phase 2, pass 1: the external JSON the plugin parses itself is now validated with Zod schemas at the boundary - Ollama /api/tags, OpenRouter /models and Serper search results (new src/utils/provider-schemas.ts with unit tests); a malformed or unexpected server response can no longer leak into runtime as untyped data"
    fixes:
      - "OpenRouter model prices arrive as decimal strings (\"0.000003\") and were previously stored as-is; they are now converted to real numbers, and an empty or unparsable /models response falls back to the built-in default model instead of caching an empty model list"
      - "Mobile readiness: web search (Serper queries and Jina page fetching) now uses Obsidian's requestUrl instead of Node's https module, which does not exist on Obsidian mobile; as a side benefit these requests bypass browser CORS like the rest of the plugin's networking"
      - "Mobile readiness: the convert-data cache hash no longer uses Node's crypto module - it is computed by a pure-TypeScript MD5 (RFC 1321) that is byte-identical to Node's, so existing cache files stay valid"
  - version: "1.2.5"
    features:
      - "Full-text search queries now filter common Russian stop words (145 function words, alongside the existing English and Chinese lists), improving result relevance for Russian-language vaults"
    fixes:
      - "Empty folders (workspace/fonts, workspace/uploads, _infio_prompts, ...) no longer produce warn-level 'Folder is empty' console spam during insight indexing; they are logged at debug level and remain visible when the Debug mode setting is on"
    other:
      - "Console hygiene: the last 116 Chinese log strings (transformation engine, insight/search views, workspace components, embedding worker, Dataview/file utilities) and the Chinese section headings inside semantic-search tool results are now English"
      - "Embedding-model descriptions for Qwen, SiliconFlow and the local transformers.js presets translated from Chinese to English"
  - version: "1.2.4"
    fixes:
      - "Insight caching never worked with Ollama / OpenAI-compatible embedding models: startup insight loading and every insight cache check failed with 'No source insight table definition found for model: ...' because the insight tables looked up the embedding dimension before the 1.2.3 runtime probe had run on that subsystem's model instance. The probe is now shared by all subsystems (RAG search, vector tables, insight tables) and memoized per model for the session, so one tiny probe request unlocks indexing, semantic search and insight caching alike; failed probes (e.g. Ollama not running yet) are retried on the next operation instead of being cached"
    other:
      - "The ad-hoc dimension probes in VectorManager and RAGEngine were unified into a single cached resolver with unit tests"
  - version: "1.2.3"
    fixes:
      - "Embeddings via Ollama (and any OpenAI-compatible provider) failed with 'No table definition found for model: ...': these providers don't have a static dimension catalog and reported dimension 0, which has no vector table. The real dimension is now probed once at first use with a tiny embedding call, memoized, and validated against the supported set (384/512/768/1024/1536) with a clear error otherwise; indexing and semantic search now work with Ollama embedding models such as nomic-embed-text or bge-m3"
  - version: "1.2.2"
    fixes:
      - "Plugin failed to start with 'ReferenceError: logger is not defined': the 1.2.1 logger sweep left main.desktop.ts calling logger.* without importing logger (esbuild compiled the unknown identifier as a runtime global; a tsc build catches this as TS2304, so always deploy through pnpm build). Import fixed; a repo-wide audit confirms no other file uses logger/showConfirm/showMessage/setDebugEnabled/t without importing it"
  - version: "1.2.1"
    features:
      - "The Debug mode setting now does what it says: with it ON, detailed [icf]-prefixed diagnostics appear in the developer console even in release builds; with it OFF, debug logging is silent"
    fixes:
      - "Native confirm()/alert() popups - forbidden by the Obsidian plugin guidelines and app-blocking - replaced with proper Obsidian modals everywhere: workspace deletion, MCP server deletion, chat-history cleanup and batch delete, workspace-edit validation, connection-test failures and the one-click configuration notice"
    other:
      - "~380 console.* call sites replaced by a gated logger (log/debug only in Debug mode, warn/error always); embedding/PGlite worker bundles keep their own console logging"
  - version: "1.2.0"
    features:
      - "The UI now fully speaks English, Russian and Simplified Chinese: every user-visible string (command palette entries, insight progress stages and errors, chat file-operation results, Dataview/Mermaid/workspace labels, tooltips, notifications) goes through the translation layer - ~120 strings, 99 new keys, guarded by a CI test that enforces identical key sets and placeholders across the three locales"
    fixes:
      - "Chinese UI no longer shows raw i18n keys in the MCP panel (the zh-cn mcpHub keys were nested under the wrong group)"
      - "No more console error spam for unsupported interface languages - the English fallback is silent and by design"
    other:
      - "Locale policy: only en/ru/zh-cn ship; the 21 other locale files inherited from upstream turned out to be empty stubs, so no working translation is lost - other interface languages fall back to English"
      - "READMEs unified: canonical English plus full Russian (new) and Simplified Chinese (rewritten from the stale upstream legacy) translations with identical structure and language-switch links"
  - version: "1.1.5"
    fixes:
      - "Settings: the Ollama embedding-model dropdown now shows the capability-filtered server list. It appeared unfiltered because the per-provider 'custom models' array - shared by all Ollama slots and accumulated from manually typed entries of earlier versions - was merged on top of the fetched list. Free-text entry is unchanged, and custom entries still appear when the Ollama server is unreachable; chat/insight/autocomplete pickers and other providers keep their existing behavior"
  - version: "1.1.4"
    features:
      - "Ollama: Test connection button in Settings with two-stage diagnostics - it tells 'server is not running' apart from 'OLLAMA_ORIGINS blocks the Obsidian origin' (both look like the same opaque network error in browsers) and shows the detected server version on success"
      - "Ollama: the embedding model dropdown now lists embedding-capable models from your server (/api/tags capabilities, with a full-list fallback for older Ollama versions) instead of manual entry only"
    fixes:
      - "Ollama chat/autocomplete/embedding network errors no longer surface as a bare 'Failed to fetch': messages now explain the likely cause (server down, OLLAMA_ORIGINS policy, wrong /v1 base URL) and point to Test connection and the README guide; mid-stream failures are covered too"
    other:
      - "README: new 'Ollama (local models)' guide - setup, Test connection verdict table, OLLAMA_ORIGINS recipes for Windows/macOS/Linux; stale 'model lists are not fetched' wording removed"
      - "20 new unit tests for the Ollama diagnostics and model listing (58 total)"
  - version: "1.1.3"
    fixes:
      - "Catalog compliance: removed the two eslint-disable directives for '@typescript-eslint/no-explicit-any' in the local text splitter (disabling that rule is not allowed); the splitter metadata is now properly typed (SplitterMetadata) with no 'any' usage - no behavior change, the golden splitter tests recorded from langchain pass unchanged"
  - version: "1.1.2"
    fixes:
      - "Local (built-in) embedding models load reliably again on desktop: the embedding worker no longer lets Electron's process shim trick the ONNX Runtime loader into a Node-only code path ('Failed to resolve module specifier worker_threads' / 'no available backend found'), and the WASM backend is now selected explicitly - embedding vectors are unchanged, existing indexes stay valid"
      - "Hugging Face mirror failover (hf-mirror.com) now actually applies when huggingface.co is unreachable - the previous fallback code set the mirror before the library was imported and silently did nothing"
    other:
      - "Dependency diet part 1: the langchain tree (~35 packages: langchain, @langchain/core, langsmith, js-tiktoken, ...) is gone - replaced by a local port of RecursiveCharacterTextSplitter verified byte-identical against langchain 0.3.37 with a 98-case differential matrix and golden tests; note chunking is unchanged, so no reindexing is needed"
      - "Dependency diet part 2: embedding engine migrated from the deprecated @xenova/transformers v2 to @huggingface/transformers v3 (onnxruntime-web 1.14 -> 1.22); the unused smart-embed-model dependency is removed"
      - "WebGPU acceleration for embeddings intentionally deferred to the on-device/mobile phase (roadmap 1) - the ORT webgpu backend needs bundling investigation first; the worker stays on WASM q8, the same backend v2 effectively used"
  - version: "1.1.1"
    fixes:
      - "Catalog submission compliance: the settings heading in the mobile placeholder tab no longer includes the plugin name (checker rule 'Avoid including the plugin name in settings headings')"
  - version: "1.1.0"
    features:
      - "Ollama is now a first-class local provider: the model picker lists models pulled from your Ollama server (/api/tags) instead of requiring manual entry"
      - "New defaults for fresh installs: Ollama for chat/insight/apply models and the on-device LocalProvider for embeddings - no API key or cloud service required"
    fixes:
      - "Removed the discontinued Infio cloud provider entirely: no more calls to api.infio.app (model list, subscription/plan checks), no device-id reporting code, no dead Pro/API-key modals; the cloud-backed built-in MCP server is gone (user-configured MCP servers are unaffected)"
      - "Reading non-Markdown files and web pages no longer depends on the dead cloud conversion service: mentions fall back to file metadata, YouTube transcripts and HTML-to-Markdown"
      - "manifest.json now honestly declares isDesktopOnly until real mobile support lands (the mobile build previously only showed a settings tab for the discontinued service)"
      - "About-panel and zh-CN README links pointed at dead or upstream-only pages; they now point to this repository and its issue tracker"
    other:
      - "Settings schema 0.6 with automatic migration: stored Infio selections are remapped to Ollama (chat/insight/apply) and to LocalProvider with the local TaylorAI/bge-micro-v2 embedding model, stale Infio model ids are cleared, collected-model lists are filtered instead of discarded, and Infio credentials are deleted from plugin data"
      - "Dependency diet: unused @huggingface/transformers removed (53 fewer installed packages); dead checkGeneral/device-id code removed"
      - "Contributor docs match CI again (pnpm 12); public roadmap added as ROADMAP.md"
  - version: "1.0.7"
