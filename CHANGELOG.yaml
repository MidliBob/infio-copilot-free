releases:
  - version: "1.2.2"
    fixes:
      - "Plugin failed to start with 'ReferenceError: logger is not defined': the 1.2.1 logger sweep left main.desktop.ts calling logger.* without importing logger (esbuild compiled the unknown identifier as a runtime global; a tsc build catches this as TS2304, so always deploy through pnpm build). Import fixed; a repo-wide audit confirms no other file uses logger/showConfirm/showMessage/setDebugEnabled/t without importing it"
  - version: "1.2.1"
    features:
      - "The Debug mode setting now does what it says: with it ON, detailed [icf]-prefixed diagnostics appear in the developer console even in release builds; with it OFF, debug logging is silent"
    fixes:
      - "Native confirm()/alert() popups - forbidden by the Obsidian plugin guidelines and app-blocking - replaced with proper Obsidian modals everywhere: workspace deletion, MCP server deletion, chat-history cleanup and batch delete, workspace-edit validation, connection-test failures and the one-click configuration notice"
    other:
      - "~380 console.* call sites replaced by a gated logger (log/debug only in Debug mode, warn/error always); embedding/PGlite worker bundles keep their own console logging"
  - version: "1.2.0"
    features:
      - "The UI now fully speaks English, Russian and Simplified Chinese: every user-visible string (command palette entries, insight progress stages and errors, chat file-operation results, Dataview/Mermaid/workspace labels, tooltips, notifications) goes through the translation layer - ~120 strings, 99 new keys, guarded by a CI test that enforces identical key sets and placeholders across the three locales"
    fixes:
      - "Chinese UI no longer shows raw i18n keys in the MCP panel (the zh-cn mcpHub keys were nested under the wrong group)"
      - "No more console error spam for unsupported interface languages - the English fallback is silent and by design"
    other:
      - "Locale policy: only en/ru/zh-cn ship; the 21 other locale files inherited from upstream turned out to be empty stubs, so no working translation is lost - other interface languages fall back to English"
      - "READMEs unified: canonical English plus full Russian (new) and Simplified Chinese (rewritten from the stale upstream legacy) translations with identical structure and language-switch links"
  - version: "1.1.5"
    fixes:
      - "Settings: the Ollama embedding-model dropdown now shows the capability-filtered server list. It appeared unfiltered because the per-provider 'custom models' array - shared by all Ollama slots and accumulated from manually typed entries of earlier versions - was merged on top of the fetched list. Free-text entry is unchanged, and custom entries still appear when the Ollama server is unreachable; chat/insight/autocomplete pickers and other providers keep their existing behavior"
  - version: "1.1.4"
    features:
      - "Ollama: Test connection button in Settings with two-stage diagnostics - it tells 'server is not running' apart from 'OLLAMA_ORIGINS blocks the Obsidian origin' (both look like the same opaque network error in browsers) and shows the detected server version on success"
      - "Ollama: the embedding model dropdown now lists embedding-capable models from your server (/api/tags capabilities, with a full-list fallback for older Ollama versions) instead of manual entry only"
    fixes:
      - "Ollama chat/autocomplete/embedding network errors no longer surface as a bare 'Failed to fetch': messages now explain the likely cause (server down, OLLAMA_ORIGINS policy, wrong /v1 base URL) and point to Test connection and the README guide; mid-stream failures are covered too"
    other:
      - "README: new 'Ollama (local models)' guide - setup, Test connection verdict table, OLLAMA_ORIGINS recipes for Windows/macOS/Linux; stale 'model lists are not fetched' wording removed"
      - "20 new unit tests for the Ollama diagnostics and model listing (58 total)"
  - version: "1.1.3"
    fixes:
      - "Catalog compliance: removed the two eslint-disable directives for '@typescript-eslint/no-explicit-any' in the local text splitter (disabling that rule is not allowed); the splitter metadata is now properly typed (SplitterMetadata) with no 'any' usage - no behavior change, the golden splitter tests recorded from langchain pass unchanged"
  - version: "1.1.2"
    fixes:
      - "Local (built-in) embedding models load reliably again on desktop: the embedding worker no longer lets Electron's process shim trick the ONNX Runtime loader into a Node-only code path ('Failed to resolve module specifier worker_threads' / 'no available backend found'), and the WASM backend is now selected explicitly - embedding vectors are unchanged, existing indexes stay valid"
      - "Hugging Face mirror failover (hf-mirror.com) now actually applies when huggingface.co is unreachable - the previous fallback code set the mirror before the library was imported and silently did nothing"
    other:
      - "Dependency diet part 1: the langchain tree (~35 packages: langchain, @langchain/core, langsmith, js-tiktoken, ...) is gone - replaced by a local port of RecursiveCharacterTextSplitter verified byte-identical against langchain 0.3.37 with a 98-case differential matrix and golden tests; note chunking is unchanged, so no reindexing is needed"
      - "Dependency diet part 2: embedding engine migrated from the deprecated @xenova/transformers v2 to @huggingface/transformers v3 (onnxruntime-web 1.14 -> 1.22); the unused smart-embed-model dependency is removed"
      - "WebGPU acceleration for embeddings intentionally deferred to the on-device/mobile phase (roadmap 1) - the ORT webgpu backend needs bundling investigation first; the worker stays on WASM q8, the same backend v2 effectively used"
  - version: "1.1.1"
    fixes:
      - "Catalog submission compliance: the settings heading in the mobile placeholder tab no longer includes the plugin name (checker rule 'Avoid including the plugin name in settings headings')"
  - version: "1.1.0"
    features:
      - "Ollama is now a first-class local provider: the model picker lists models pulled from your Ollama server (/api/tags) instead of requiring manual entry"
      - "New defaults for fresh installs: Ollama for chat/insight/apply models and the on-device LocalProvider for embeddings - no API key or cloud service required"
    fixes:
      - "Removed the discontinued Infio cloud provider entirely: no more calls to api.infio.app (model list, subscription/plan checks), no device-id reporting code, no dead Pro/API-key modals; the cloud-backed built-in MCP server is gone (user-configured MCP servers are unaffected)"
      - "Reading non-Markdown files and web pages no longer depends on the dead cloud conversion service: mentions fall back to file metadata, YouTube transcripts and HTML-to-Markdown"
      - "manifest.json now honestly declares isDesktopOnly until real mobile support lands (the mobile build previously only showed a settings tab for the discontinued service)"
      - "About-panel and zh-CN README links pointed at dead or upstream-only pages; they now point to this repository and its issue tracker"
    other:
      - "Settings schema 0.6 with automatic migration: stored Infio selections are remapped to Ollama (chat/insight/apply) and to LocalProvider with the local TaylorAI/bge-micro-v2 embedding model, stale Infio model ids are cleared, collected-model lists are filtered instead of discarded, and Infio credentials are deleted from plugin data"
      - "Dependency diet: unused @huggingface/transformers removed (53 fewer installed packages); dead checkGeneral/device-id code removed"
      - "Contributor docs match CI again (pnpm 12); public roadmap added as ROADMAP.md"
  - version: "1.0.7"
    fixes:
      - "Catalog review polish: window-scoped timers, Obsidian DOM helpers (createDiv/createSpan/createEl), trashFile instead of vault delete/trash, requestUrl for simple GET/POST calls, popout-safe helpers, deprecated substr/JSX namespace removed, unused imports and dead locals cleaned, thrown rejections normalized to Error, switch-case lexical scopes fixed"
    other:
      - "Deep type-safety warnings (no-unsafe-* family), guarded Node built-in imports and the declarative settings API are deferred to the roadmap with written rationale (advisory-only categories)"
  - version: "1.0.6"
    fixes:
      - "Catalog review compliance: all floating promises are now explicitly marked with the void operator (no behavior change, fire-and-forget semantics preserved)"
  - version: "1.0.5"
    fixes:
      - "CSS review compliance: removed duplicate declarations, replaced clip-path spinner animation, scrollbar-width and multi-column props with broadly supported equivalents, removed 'all: unset'"
      - "Dependency advisories: dropped unused drizzle-orm, bumped langchain/diff/MCP SDK within API-stable lines, added pnpm overrides for transitive packages (minimatch, picomatch, qs, form-data, follow-redirects, ws, nanoid, prismjs, protobufjs, dompurify and others)"
    other:
      - "Lockfile refresh deferred to maintainer machine/CI: run pnpm install and commit pnpm-lock.yaml"
      - "Build tooling: pnpm 12 config via pnpm-workspace.yaml (overrides moved out of package.json, exotic git subdeps allowed); unused plausible-tracker analytics dependency removed; uuid moved to v11"
  - version: "1.0.4"
    fixes:
      - "Replaced deprecated/unused dependencies flagged by the catalog review: axios and js-yaml removed, lodash/lodash.debounce/lodash.isequal replaced by a small local utility module, builtin-modules replaced by node:module, deprecated eslint plugins dropped"
    other:
      - "Bundle is ~90 KB smaller; no user-facing behavior changes"
  - version: "1.0.3"
    fixes:
      - "Obsidian catalog review compliance: all eslint directives now carry descriptions, forbidden rule disables removed, innerHTML and direct style assignments replaced with DOMParser/CSS-class approaches, settings headings use the Setting API"
    other:
      - "Code-quality pass only; no user-facing behavior changes"
  - version: "1.0.2"
    fixes:
      - "Removed the legacy self-update mechanism (download/extract/overwrite own files and programmatic plugin reload) flagged by the Obsidian catalog review"
      - "Removed node-machine-id hardware fingerprinting; device id is now a locally persisted random pseudo-id"
    other:
      - "Dropped jszip dependency and the Pro-upgrade UI of the discontinued Infio service"
      - "Release assets now ship with GitHub artifact attestations (build provenance)"
  - version: "1.0.0"
    features:
      - "Independent project: rebranded to Infio Copilot Free (plugin id infio-copilot-free, author MidliBob)"
      - "UI styles, view types and storage keys moved to the icf-* namespace"
    fixes:
      - "Settings tab lookup and plugin-folder asset loading now use the new plugin id"
    other:
      - "Lineage: community continuation of Infio Copilot 0.8.x (Felix.D), itself a fork of Smart Composer (Heesu Suh); MIT"
      - "Breaking for custom CSS snippets: class prefix changed from infio- to icf-"
      - "Chat/vector database keeps its storage name (infio-db) for data continuity; do not run the original Infio Copilot simultaneously"
  - version: "0.8.7"
