    other:
      - "The breaker guards connectivity only, not correctness: any server response (even HTTP 500/429/'model not found') counts as reachable and resets it, so a single flaky chunk still retries exactly as before; after the cooldown one probe request is allowed through, and a success fully closes the circuit"
      - "network-errors.ts gained isNetworkFailure() (transport-level classification of caught values, including the plugin's own 'Cannot reach ...' wording); extractErrorMessage() moved there from error-notice.ts and is re-exported for API compatibility"
